name: scheduled-enrichment

on:
  schedule:
    - cron: "45 2 * * *"
  workflow_dispatch:

concurrency:
  group: ioc-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore enrichment cache
        uses: actions/cache@v4
        with:
          path: enrich-cache.json
          key: ioc-enrich-v1
          restore-keys: ioc-enrich-

      - name: Generate internal table
        run: python3 scripts/generate_feeds.py

      - name: Enrich (ASN/geo; TIはkeyがあれば任意実行)
        env:
          URLHAUS_AUTH_KEY: ${{ secrets.URLHAUS_AUTH_KEY }}
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          GREYNOISE_API_KEY: ${{ secrets.GREYNOISE_API_KEY }}
          ABUSEIPDB_API_KEY: ${{ secrets.ABUSEIPDB_API_KEY }}
        run: python3 scripts/enrich.py --feeds internal/iocs-internal.csv --cache enrich-cache.json --force

      - name: Regenerate feeds with fresh enrichment
        run: python3 scripts/generate_feeds.py --as-of "$(date -u +%F)"

      - name: Changelog
        run: |
          git show HEAD:feeds/iocs.csv > /tmp/prev-iocs.csv 2>/dev/null || true
          python3 scripts/generate_changelog.py --prev-file /tmp/prev-iocs.csv --new-file feeds/iocs.csv

      - name: Validate feeds
        run: python3 scripts/validate.py

      - name: Commit (only if changed)
        run: |
          git config user.name "ioc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add feeds/ iocs.csv metadata.json README.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No feed changes - skip commit"
          else
            git commit -m "automation: daily enrichment refresh [skip ci]"
            git push
          fi
